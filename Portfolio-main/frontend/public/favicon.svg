<svg width="32" height="32" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a"/>
  
  <!-- Gradient border -->
  <circle cx="100" cy="100" r="90" stroke="url(#faviconGradient)" stroke-width="3" fill="none"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  
  <!-- Stylized E letter for Eman Fatima -->
  <path
    d="M 130 65 L 75 65 L 75 135 L 130 135 M 75 100 L 120 100"
    stroke="#6366F1"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
